<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 474" width="696" height="474" role="img"><style>
.w,.sym-box{stroke:var(--sym);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
