name: Release

# A push of a tag `vX.Y.Z` builds the wheel and the sdist and publishes them
# to PyPI by trusted publishing: no token is stored anywhere, PyPI trusts
# this repository's workflow by name. That trust is set up once, by hand,
# on PyPI's side — project "thermodraw", owner and repository as on GitHub,
# workflow "release.yml", environment "pypi" — and until it is, this job
# fails at the publish step and nothing else happens.
#
# The tag has to be the package's own version. A tag pushed against the
# wrong commit would otherwise publish whatever version that commit says,
# under a name PyPI will never let go of.
#
# After PyPI, a GitHub Release on the tag, with the changelog's own section
# as its notes and the same wheel and sdist attached. That is what the
# repository's sidebar shows; a bare tag shows as "1 tag".

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    name: build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag is the package's version
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" twine
          want="v$(python -c 'import thermodraw; print(thermodraw.__version__)')"
          test "$want" = "${{ github.ref_name }}" || {
            echo "tag ${{ github.ref_name }} but the package says $want"; exit 1; }

      - name: Tests
        run: |
          python -m pytest -q

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Verify the actual release artifacts
        run: python tools/release_smoke.py dist

      - name: Prepare release notes before publication
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --verify-tag --notes-file notes.md dist/*
