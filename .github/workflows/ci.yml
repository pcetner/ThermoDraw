name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.9 is the declared floor in pyproject.toml, and the only thing that
        # actually verifies it. Windows is here because the library emits "→"
        # and "″", and a default-encoding write on Windows is cp1252.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        # No PYTHONUTF8 here on purpose. Windows' cp1252 default is one of the
        # things this matrix is meant to catch, so let it be the default.
        run: python -m pytest -q

      - name: Docs are a fresh render
        # tests/test_docs.py runs this too; keeping it as its own step means a
        # stale docs/symbol-reference.html is named in the job list, not buried
        # in a test summary.
        run: python tools/gen_docs.py --check

      - name: Dictionary is a fresh render
        # Same reason. It was only inside the test run, so a stale
        # Dictionary.html was buried in a summary while the reference sheet
        # got a named step — and the dictionary is the page a reader opens.
        run: python tools/gen_dictionary.py --check

      - name: Nothing was regenerated in place
        # The freshness guards read; if one ever writes, the checkout is dirty
        # and the run should say so rather than pass quietly.
        run: git diff --exit-code

  goldens:
    name: goldens regenerate from current code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Rewrite every golden from current output
        # `--update-goldens` writes and then skips, so on its own it can never
        # fail. The diff below is the assertion: a golden that the code cannot
        # reproduce is exactly the drift goldens exist to detect, and until
        # this job nothing ever tried.
        run: python -m pytest -q tests/test_golden.py --update-goldens

      - name: They match what is committed
        run: git diff --exit-code -- tests/golden

  assets:
    name: gallery and README images are fresh renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Re-render
        # The gallery is the project's central evidence, and two of its five
        # renders had gone stale with nothing to say so. Same guard for the
        # six README images.
        run: |
          python examples/render_demo.py
          for f in examples/gallery/*/*.json; do
            thermodraw render "$f" -o "${f%.json}.svg"
          done

      - name: They match what is committed
        run: git diff --exit-code -- docs/assets examples/gallery

  types:
    name: the py.typed promise holds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: mypy
        # The wheel ships py.typed and the build job asserts it is there.
        # Default strictness passed while every public entry point was
        # unannotated, so a consumer's checker saw `Any` for every call and
        # the job's name was a claim the code did not keep. The entry points
        # are annotated and `--check-untyped-defs` is on: it went from 112
        # errors to none, and 87 of those were one cause, the `**who`
        # keyword spreads in `_layout.py`.
        run: python -m mypy --check-untyped-defs src/thermodraw

  build:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        # Catches a missing licence or a README that PyPI will not render,
        # before the upload rather than after it.
        run: python -m twine check dist/*

      - name: The wheel carries py.typed and the licences
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for want in ("thermodraw/py.typed",
                       "thermodraw/fonts/OFL.txt"):
              assert want in names, f"{want} missing from the wheel"
          for want in ("LICENSE", "NOTICE", "OFL.txt"):
              assert any(n.endswith(want) and ".dist-info/" in n
                         for n in names), f"{want} missing from dist-info"
          print("\n".join(sorted(names)))
          PY
